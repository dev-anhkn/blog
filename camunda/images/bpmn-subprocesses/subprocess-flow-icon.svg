<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- decorative accent dots -->
  <circle cx="40" cy="46" r="9" fill="#86efac" stroke="#000" stroke-width="6"/>
  <circle cx="256" cy="26" r="7" fill="#c4b5fd" stroke="#000" stroke-width="5"/>
  <circle cx="474" cy="54" r="8" fill="#fde68a" stroke="#000" stroke-width="6"/>
  <circle cx="30" cy="472" r="8" fill="#fca5a5" stroke="#000" stroke-width="6"/>
  <circle cx="482" cy="466" r="9" fill="#7dd3fc" stroke="#000" stroke-width="6"/>

  <!-- main flow: start -> subprocess -> end -->
  <circle cx="70" cy="200" r="38" fill="#7dd3fc" stroke="#000" stroke-width="14"/>

  <line x1="108" y1="200" x2="158" y2="200" stroke="#000" stroke-width="14" stroke-linecap="round"/>
  <polygon points="158,200 134,186 134,214" fill="#000"/>

  <rect x="166" y="76" width="214" height="248" rx="26" fill="#5eead4" stroke="#000" stroke-width="16" stroke-linejoin="round"/>

  <!-- collapsed-subprocess "+" marker -->
  <rect x="253" y="304" width="40" height="40" rx="6" fill="#fff" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
  <line x1="273" y1="312" x2="273" y2="336" stroke="#000" stroke-width="10" stroke-linecap="round"/>
  <line x1="261" y1="324" x2="285" y2="324" stroke="#000" stroke-width="10" stroke-linecap="round"/>

  <!-- boundary event + exception branch -->
  <circle cx="330" cy="324" r="22" fill="none" stroke="#000" stroke-width="7"/>
  <circle cx="330" cy="324" r="13" fill="#fbbf24" stroke="#000" stroke-width="7"/>
  <line x1="330" y1="346" x2="330" y2="378" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
  <circle cx="330" cy="388" r="9" fill="#f87171" stroke="#000" stroke-width="6"/>

  <line x1="386" y1="200" x2="436" y2="200" stroke="#000" stroke-width="14" stroke-linecap="round"/>
  <polygon points="436,200 412,186 412,214" fill="#000"/>

  <circle cx="470" cy="200" r="34" fill="#fca5a5" stroke="#000" stroke-width="16"/>

  <!-- association to an external reusable process (call activity) -->
  <line x1="195" y1="324" x2="195" y2="398" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>

  <rect x="108" y="402" width="176" height="92" rx="18" fill="#ddd6fe" stroke="#000" stroke-width="10" stroke-dasharray="16 10" stroke-linejoin="round"/>

  <circle cx="140" cy="448" r="9" fill="#fff" stroke="#000" stroke-width="5"/>
  <line x1="149" y1="448" x2="168" y2="448" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <rect x="170" y="434" width="30" height="28" rx="5" fill="#fff" stroke="#000" stroke-width="5"/>
  <line x1="200" y1="448" x2="220" y2="448" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="240" cy="448" r="9" fill="#fff" stroke="#000" stroke-width="6"/>

</svg>
